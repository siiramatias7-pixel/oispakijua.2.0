<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Kiljupeli2.o 🍶</title>
<style>
body {
  background: #222;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

#score {
  font-size: 20px;
  margin: 10px;
}

#game {
  width: 500px;
  height: 500px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 5px;
  background: #444;
  padding: 5px;
  border-radius: 10px;
}

.cell {
  width: 100%;
  height: 100%;
  background: #666;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.cell img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  pointer-events: none;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  font-size: 16px;
  cursor: pointer;
}

.hidden {
  display: none;
}

#gameOverMessage {
  font-size: 24px;
  color: #ff4444;
  margin: 10px;
  display: none;
}
</style>
</head>
<body>

<h1>🍶 Kiljupeli 🍶</h1>

<div id="score">Pisteet: 0</div>

<div id="game"></div>

<div>
  <button id="katkaisu" class="hidden">🚑 Katkaisuhoito (-1000 pistettä)</button>
  <button id="newGame">🔄 Uusi peli</button>
</div>

<p>Nuolinäppäimet / WASD</p>

<div>
  <input type="text" id="katkaisuCode" maxlength="4" placeholder="Anna 4-numeroinen koodi">
  <button id="applyCode">💉 Käytä koodia</button>
</div>

<div id="gameOverMessage">💀 Peli loppui! Paina "Uusi peli" aloittaaksesi uudelleen.</div>

<script>
const SIZE = 4;
let score = 0;
let board = [];
const WIN_CODE = "3767";

// Kuva-arvot
const IMAGES = {
  2: "images/2.png",
  4: "images/4.png",
  8: "images/8.png",
  16: "images/16.png",
  32: "images/32.png",
  64: "images/64.png",
  128: "images/128.png",
  256: "images/256.png",
  512: "images/512.png",
  1024: "images/1024.png",
  2048: "images/2048.png"
};

function init() {
  score = 0;
  board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
  addTile();
  addTile();
  draw();
  document.getElementById("gameOverMessage").style.display = "none";
}

function addTile() {
  let empty = [];
  for (let r=0;r<SIZE;r++)
    for (let c=0;c<SIZE;c++)
      if (board[r][c]===0) empty.push({r,c});
  if (!empty.length) return;
  let spot = empty[Math.floor(Math.random()*empty.length)];
  board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
}

function draw() {
  const game = document.getElementById("game");
  game.innerHTML = "";
  for (let r=0;r<SIZE;r++) {
    for (let c=0;c<SIZE;c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      let val = board[r][c];
      if (val !== 0) {
        const img = document.createElement("img");
        img.src = IMAGES[val];
        cell.appendChild(img);
      }
      game.appendChild(cell);
    }
  }
  document.getElementById("score").textContent = "Pisteet: " + score;
  document.getElementById("katkaisu").classList.toggle("hidden", score < 1000 || document.getElementById("gameOverMessage").style.display==="block");
  checkGameOver();
}

function slide(row) {
  row = row.filter(v => v);
  for (let i=0;i<row.length-1;i++) {
    if (row[i]===row[i+1]) {
      row[i]*=2;
      score += row[i];
      row[i+1]=0;
    }
  }
  row = row.filter(v => v);
  while (row.length < SIZE) row.push(0);
  return row;
}

function rotate(times) {
  for (let i=0;i<times;i++)
    board = board[0].map((_,i) => board.map(r=>r[i]).reverse());
}

function canMove() {
  for (let r=0;r<SIZE;r++) {
    for (let c=0;c<SIZE;c++) {
      if (board[r][c]===0) return true;
      if (c<SIZE-1 && board[r][c]===board[r][c+1]) return true;
      if (r<SIZE-1 && board[r][c]===board[r+1][c]) return true;
    }
  }
  return false;
}

function move(dir) {
  if(document.getElementById("gameOverMessage").style.display==="block") return;

  let old = JSON.stringify(board);
  if (dir==="up") rotate(3);
  if (dir==="right") rotate(2);
  if (dir==="down") rotate(1);
  for (let i=0;i<SIZE;i++) board[i]=slide(board[i]);
  if (dir==="up") rotate(1);
  if (dir==="right") rotate(2);
  if (dir==="down") rotate(3);
  if (JSON.stringify(board)!==old) {
    addTile();
    draw();
  }
}

document.addEventListener("keydown", e=>{
  if (e.key==="ArrowLeft"||e.key==="a") move("left");
  if (e.key==="ArrowRight"||e.key==="d") move("right");
  if (e.key==="ArrowUp"||e.key==="w") move("up");
  if (e.key==="ArrowDown"||e.key==="s") move("down");
});

document.getElementById("katkaisu").onclick = ()=>{
  if(score < 1000) return;
  if(document.getElementById("gameOverMessage").style.display==="block") return; // Ei voi käyttää loppuneena

  score -= 1000;
  for(let r=0;r<SIZE;r++)
    for(let c=0;c<SIZE;c++)
      if(board[r][c]===2||board[r][c]===4||board[r][c]===8)
        board[r][c]=0;

  draw();
};

document.getElementById("applyCode").onclick = ()=>{
  let code = document.getElementById("katkaisuCode").value;
  if(code===WIN_CODE){
    if(score>=1000) score -= 1000;
    for(let r=0;r<SIZE;r++)
      for(let c=0;c<SIZE;c++)
        if(board[r][c]===2||board[r][c]===4||board[r][c]===8)
          board[r][c]=0;
    draw();
    document.getElementById("katkaisuCode").value="";
    document.getElementById("gameOverMessage").style.display="none"; // poistaa loppumisviestin
  } else {
    alert("Väärä koodi!");
  }
};

document.getElementById("newGame").onclick = ()=>init();

function checkGameOver(){
  if(!canMove()){
    document.getElementById("gameOverMessage").style.display="block";
  } else {
    document.getElementById("gameOverMessage").style.display="none";
  }
}

init();
</script>
</body>
</html>
