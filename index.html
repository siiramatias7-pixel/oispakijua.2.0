<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Kiljupeli2.0 🍶</title>
<style>
body {
  background: #8c35be;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

#score { font-size: 20px; margin: 10px; }

#gameContainer {
  position: relative;
  width: 500px;
  height: 500px;
  margin: 20px auto;
}

#game {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 5px;
  background: #b66767;
  padding: 5px;
  border-radius: 10px;
  position: relative;
}

.cell {
  width: 100%;
  height: 100%;
  background: #c56363;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.cell img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  pointer-events: none;
}

button {
  margin: 5px;
  padding: 10px 15px;
  font-size: 16px;
  cursor: pointer;
}

#overlay {
  position: absolute;
  top:0;
  left:0;
  width: 100%;
  height: 100%;
  background: rgba(34,34,34,0.9);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border-radius: 10px;
  display: none;
}

#overlay input {
  width: 80px;
  padding: 5px;
  margin: 5px;
  font-size: 16px;
  text-align: center;
}
</style>
</head>
<body>

<h1>🍶 Kiljupeli2.0 🍶</h1>

<div id="score">Pisteet: 0</div>

<div id="gameContainer">
  <div id="game"></div>
  <div id="overlay">
    <div style="font-size:24px; color:#ff4444; margin-bottom:10px;">💀 Peli loppui!</div>
    <button id="newGameOverlay">🔄 Aloita uusi peli</button>
    <div style="margin-top:10px;">
      <input type="text" id="katkaisuCodeOverlay" maxlength="4" placeholder="Anna 4-numeroinen koodi">
      <button id="applyCodeOverlay">💉 Käytä koodia</button>
    </div>
  </div>
</div>

<div style="margin-top:10px;">
  <button id="katkaisu">🚑 Katkaisuhoito (-1000 pistettä)</button>
</div>

<p>Älä roiku kattokruunussa!!</p>

<audio id="sound64" src="sound64.mp3"></audio>

<script>
const SIZE = 4;
let score = 0;
let board = [];
const WIN_CODE = "3767";

const IMAGES = {
  2: "images/2.png",
  4: "images/4.png",
  8: "images/8.png",
  16: "images/16.png",
  32: "images/32.png",
  64: "images/64.png",
  128: "images/128.png",
  256: "images/256.png",
  512: "images/512.png",
  1024: "images/1024.png",
  2048: "images/2048.png"
};

function init() {
  score = 0;
  board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
  addTile();
  addTile();
  draw();
  document.getElementById("overlay").style.display="none";
}

function addTile() {
  let empty = [];
  for (let r=0;r<SIZE;r++)
    for (let c=0;c<SIZE;c++)
      if (board[r][c]===0) empty.push({r,c});
  if (!empty.length) return;
  let spot = empty[Math.floor(Math.random()*empty.length)];
  board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
  if(board[spot.r][spot.c] === 64) playSound();
}

function playSound(){
  const snd = document.getElementById("sound64");
  snd.currentTime = 0;
  snd.play();
}

function draw() {
  const game = document.getElementById("game");
  game.innerHTML = "";
  for (let r=0;r<SIZE;r++) {
    for (let c=0;c<SIZE;c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      let val = board[r][c];
      if (val !== 0) {
        const img = document.createElement("img");
        img.src = IMAGES[val];
        cell.appendChild(img);
      }
      game.appendChild(cell);
    }
  }
  document.getElementById("score").textContent = "Pisteet: " + score;
  document.getElementById("katkaisu").classList.toggle("hidden", score < 1000 || document.getElementById("overlay").style.display!=="none");
  checkGameOver();
}

function slide(row) {
  row = row.filter(v => v);
  for (let i=0;i<row.length-1;i++) {
    if (row[i]===row[i+1]) {
      row[i]*=2;
      score += row[i];
      row[i+1]=0;
      if(row[i]===64) playSound();
    }
  }
  row = row.filter(v => v);
  while (row.length < SIZE) row.push(0);
  return row;
}

function rotate(times) {
  for (let i=0;i<times;i++)
    board = board[0].map((_,i) => board.map(r=>r[i]).reverse());
}

function canMove() {
  for (let r=0;r<SIZE;r++) {
    for (let c=0;c<SIZE;c++) {
      if (board[r][c]===0) return true;
      if (c<SIZE-1 && board[r][c]===board[r][c+1]) return true;
      if (r<SIZE-1 && board[r][c]===board[r+1][c]) return true;
    }
  }
  return false;
}

function move(dir) {
  if(document.getElementById("overlay").style.display==="flex") return;
  let old = JSON.stringify(board);
  if (dir==="up") rotate(3);
  if (dir==="right") rotate(2);
  if (dir==="down") rotate(1);
  for (let i=0;i<SIZE;i++) board[i]=slide(board[i]);
  if (dir==="up") rotate(1);
  if (dir==="right") rotate(2);
  if (dir==="down") rotate(3);
  if (JSON.stringify(board)!==old) {
    addTile();
    draw();
  }
}

document.addEventListener("keydown", e=>{
  if (e.key==="ArrowLeft"||e.key==="a") move("left");
  if (e.key==="ArrowRight"||e.key==="d") move("right");
  if (e.key==="ArrowUp"||e.key==="w") move("up");
  if (e.key==="ArrowDown"||e.key==="s") move("down");
});

document.getElementById("katkaisu").onclick = ()=>{
  if(score < 1000) return;
  if(document.getElementById("overlay").style.display==="flex") return;
  score -= 1000;
  for(let r=0;r<SIZE;r++)
    for(let c=0;c<SIZE;c++)
      if(board[r][c]===2||board[r][c]===4||board[r][c]===8)
        board[r][c]=0;
  draw();
};

document.getElementById("newGameOverlay").onclick = ()=>init();

document.getElementById("applyCodeOverlay").onclick = ()=>{
  let code = document.getElementById("katkaisuCodeOverlay").value;
  if(code===WIN_CODE){
    if(score>=1000) score -= 1000;
    for(let r=0;r<SIZE;r++)
      for(let c=0;c<SIZE;c++)
        if(board[r][c]===2||board[r][c]===4||board[r][c]===8)
          board[r][c]=0;
    draw();
    document.getElementById("katkaisuCodeOverlay").value="";
    document.getElementById("overlay").style.display="none";
  } else {
    alert("Väärä koodi!");
  }
};

function checkGameOver(){
  if(!canMove()){
    document.getElementById("overlay").style.display="flex";
  } else {
    document.getElementById("overlay").style.display="none";
  }
}

init();
</script>
</body>
</html>
